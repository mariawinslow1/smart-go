<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Аналитика клиентских отзывов для бизнеса: закономерности, приоритеты и понятные рекомендации." />
    <meta name="theme-color" content="#173b34" />
    <meta property="og:locale" content="ru_RU" />
    <title>Maria Winslow — аналитика клиентских отзывов для бизнеса</title>
  </head>
  <body>
    <!-- Static form for Netlify build-time form detection.
         The visible React form on /audit submits the same field names. -->
    <form name="primary-audit" method="POST" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="primary-audit" />
      <input name="company" />
      <input name="website" type="url" />
      <input name="reviews" type="url" />
      <input name="name" />
      <input name="contact" />
      <textarea name="message"></textarea>
      <input name="consent" type="checkbox" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
